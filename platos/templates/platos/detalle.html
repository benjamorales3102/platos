{% extends "platos/base.html" %}
{% block content %}
    <div class="detail-card">
        <h1>{{ plato.nombre|title }}</h1>
        <p>{{ plato.descripcion|capfirst }}</p>

        <div class="meta">
            <p><strong>Precio:</strong> ${{ plato.precio|floatformat:0 }}</p>
            <p><strong>Precio con propina (10%):</strong> ${{ precio_con_propina|floatformat:0 }}</p>
            <p><strong>Etiqueta:</strong> <span class="badge">{{ etiqueta|upper }}</span></p>
        </div>

        <a class="btn-link" href="{% url 'platos:inicio' %}">Volver a la lista de platos</a>
    </div>
{% endblock %}
